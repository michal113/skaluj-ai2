# skaluj.ai - backend chatbota (Cloudflare Worker -> OpenRouter)
# Wdraza sie samo po pushu na main (.github/workflows/deploy-workers.yml), ktory wpisuje tez ID bazy ponizej.
# Recznie z tego folderu: wpisz database_id bazy skaluj-crm i  npx wrangler deploy
# Sekret ustaw raz (nie trafia do repo):  npx wrangler secret put OPENROUTER_API_KEY
name = "botszkalu"
main = "worker.js"
compatibility_date = "2024-11-01"

# nie kasuj zmiennych ustawionych recznie w panelu Cloudflare przy kazdym wdrozeniu
keep_vars = true

# Limiter zapytan Cloudflare (wymaga wrangler >= 4.36): 10 wiadomosci na 60 s na adres IP,
# liczony w kazdej lokalizacji Cloudflare osobno. Bez tego bindingu worker uzywa limitu awaryjnego w pamieci.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Dzienne liczniki rozmow do panelu CRM (ta sama baza co CRM). Same liczby, bez tresci i bez IP.
# ID wpisuje automat wdrozenia (z konta Cloudflare); recznie: npx wrangler d1 list
[[d1_databases]]
binding = "STATS_DB"
database_name = "skaluj-crm"
database_id = "WKLEJ_ID_BAZY_PO_UTWORZENIU"
